<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>지게차 실기 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #6f7f86; overflow: hidden; touch-action: none; }
    #wrap { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; font: 600 18px/1.4 -apple-system, system-ui, sans-serif; background: #2b3236; }
    #bar { width: 220px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.2); overflow: hidden; }
    #bar > div { width: 0; height: 100%; background: #F5A623; transition: width .2s; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="canvas"></canvas></div>
  <div id="loading"><div>지게차 실기 3D 불러오는 중</div><div id="bar"><div></div></div></div>
  <script src="./game/index.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
